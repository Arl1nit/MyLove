<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="love-page">
        <div class="love-content">
            <div class="love-row">
                <span class="letter letter-i" aria-hidden="true">I</span>
                <svg class="heart" viewBox="0 0 100 90" role="img" aria-label="Heart">
                    <path d="M50 88 8 46A25 25 0 1 1 50 20 25 25 0 1 1 92 46Z"></path>
                </svg>
                <span class="letter letter-u" aria-hidden="true">U</span>
            </div>
            <div class="messages" aria-hidden="true"></div>
        </div>
    </main>
</body>
</html>
